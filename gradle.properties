# Maven Central answers 429 to shared CI runners during plugin classpath resolution
# (Quality run 46075271209 on main). Gradle's default is 3 attempts with 125 ms backoff;
# these raise both, the same values the Android repository of the family uses.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=5000
